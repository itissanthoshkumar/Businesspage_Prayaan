{# Back-office shell.

   A fixed brand rail on the left, work surface on the right. All styling lives
   in /static/admin.css: the admin runs under style-src 'self', so an inline
   style="" or <style> block is dropped by the browser and would silently not
   apply. The only script is /static/admin.js, loaded on every page but
   inert unless the page-editor form is present. #}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
{# Product name lives in exactly two places — this title and the rail tag
   below (plus the sign-in eyebrow) — so it is one edit to change. #}
<title>{% block title %}{% endblock %} — Angadi</title>
<link rel="icon" href="/static/img/prayaan-mark.png">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="adm{% if not session %} adm-out{% endif %}">
<a class="skip" href="#main">Skip to content</a>
<div class="shell">

  {% if session %}
  <aside class="rail">
    <div class="railhead">
      <a class="raillogo" href="/admin/pages" aria-label="Angadi — back-office home">
        <picture>
          <source srcset="/static/img/prayaan-logo-full.webp" type="image/webp">
          <img src="/static/img/prayaan-logo-full.png" alt="Prayaan Capital" width="167" height="30">
        </picture>
      </a>
      <span class="railtag">Angadi &middot; Back-office</span>
    </div>

    <nav class="railnav" aria-label="Back-office">
      <a href="/admin/pages" {% if nav=='pages' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/>
        </svg>Pages</a>
      <a href="/admin/leads" {% if nav=='leads' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 13h4l2 3h6l2-3h4"/><path d="M5 5h14l2 8v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5z"/>
        </svg>Leads</a>
      <a href="/admin/reports" {% if nav=='reports' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 21V4"/><path d="M5 4h11l-1.6 3.5L16 11H5"/>
        </svg>Reports{% if open_reports %}<span class="railcount">{{ open_reports }}</span>{% endif %}</a>
      {% if session.r == 'admin' %}
      <a href="/admin/users" {% if nav=='users' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0"/>
          <path d="M16.5 5.6a3.2 3.2 0 010 5.2"/><path d="M18 14.6a6 6 0 013 5.4"/>
        </svg>Users</a>
      {% endif %}
    </nav>

    <div class="railfoot">
      {% if base_url %}
      {% set is_dev = 'localhost' in base_url or '127.0.0.1' in base_url %}
      {# Which deployment am I looking at? Staff work the live book and a local
         copy that looks identical; saying so out loud prevents the wrong one
         being edited. #}
      <p class="railenv{% if is_dev %} dev{% endif %}">
        <span class="envdot" aria-hidden="true"></span>
        <span class="envhost">{{ 'Local preview' if is_dev else base_url|replace('https://','')|replace('http://','') }}</span>
      </p>
      {% endif %}
      <div class="railuser">
        <span class="avatar" aria-hidden="true">{{ session.u[:2]|upper }}</span>
        <span class="railwho">
          <a href="/admin/password" title="Change your password">{{ session.u }}</a>
          <span>{{ session.r }}</span>
        </span>
        <form method="post" action="/admin/logout" class="railout">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit" title="Sign out">Sign out</button>
        </form>
      </div>
    </div>
  </aside>
  {% endif %}

  <main class="stage" id="main">
    <div class="stagewrap">
      {% block body %}{% endblock %}
    </div>
  </main>

</div>
<script src="/static/admin.js"></script>
</body>
</html>
