<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Bold geometric sunburst">
  <!-- Default 12 — SUNBURST. Bold and abstract: full colour, no object at all,
       so it suits every trade the way Weave does but with none of its reserve.
       Radial, so the square crop is the whole design. -->
  <defs>
    <clipPath id="sb-clip"><rect width="1200" height="600"/></clipPath>
    <linearGradient id="sb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2743"/><stop offset="1" stop-color="#2C1B4A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#sb-bg)"/>

  <g clip-path="url(#sb-clip)">
    <!-- rays, alternating through the decorative palette -->
    <g transform="translate(600 300)" opacity=".92">
      <g>
        <path d="M0 0L700 -186 700 -62Z" fill="#F4633A"/>
        <path d="M0 0L700 -62 700 62Z" fill="#e3b44f"/>
        <path d="M0 0L700 62 700 186Z" fill="#F06AA8"/>
      </g>
      <g transform="rotate(180)">
        <path d="M0 0L700 -186 700 -62Z" fill="#12B8A6"/>
        <path d="M0 0L700 -62 700 62Z" fill="#3B9BF0"/>
        <path d="M0 0L700 62 700 186Z" fill="#8CC63F"/>
      </g>
      <g transform="rotate(90)">
        <path d="M0 0L700 -120 700 120Z" fill="#6A5AE0" opacity=".85"/>
      </g>
      <g transform="rotate(-90)">
        <path d="M0 0L700 -120 700 120Z" fill="#B23A16" opacity=".8"/>
      </g>
    </g>

    <!-- concentric rings punching back to the ground -->
    <g transform="translate(600 300)" fill="none" stroke="#1c2743" stroke-width="14" opacity=".55">
      <circle r="212"/><circle r="272"/><circle r="332"/>
    </g>

    <!-- the core -->
    <g transform="translate(600 300)">
      <circle r="150" fill="#1c2743"/>
      <circle r="150" fill="none" stroke="#e3b44f" stroke-width="6"/>
      <circle r="112" fill="none" stroke="#e3b44f" stroke-width="3" opacity=".6"/>
      <g fill="#e3b44f">
        <circle cx="0" cy="-62" r="11"/><circle cx="54" cy="-31" r="11"/>
        <circle cx="54" cy="31" r="11"/><circle cx="0" cy="62" r="11"/>
        <circle cx="-54" cy="31" r="11"/><circle cx="-54" cy="-31" r="11"/>
      </g>
      <circle r="22" fill="#F4633A"/>
    </g>
  </g>
</svg>
